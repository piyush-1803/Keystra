<!-- Micro-Interactions Script -->
<script>
        // Simulate real-time metric changes
        document.addEventListener('DOMContentLoaded', () => {
            const wpmDisplay = document.querySelector('.font-display-metrics');
            const accuracyDisplay = document.querySelector('.text-secondary');
            const timerDisplay = document.querySelector('.font-data-mono.text-on-surface');
            
            let wpm = 124;
            let seconds = 165; // 02:45

            setInterval(() => {
                // Fluctuating WPM
                wpm += (Math.random() - 0.5) * 4;
                wpmDisplay.textContent = Math.round(wpm);

                // Update Timer
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);

            // Add Draggable Visual Logic (Visual only)
            const overlay = document.querySelector('.overlay-drag');
            let isDragging = false;
            
            overlay.addEventListener('mousedown', (e) => {
                if(e.target.closest('button')) return;
                isDragging = true;
                overlay.style.cursor = 'grabbing';
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                overlay.style.cursor = 'default';
            });
        });
    </script>
